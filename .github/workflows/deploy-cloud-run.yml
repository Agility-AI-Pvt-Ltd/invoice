# Requires one-time GCP setup: Artifact Registry repo, Cloud Run service, and either
# Workload Identity Federation (recommended) or a JSON service account key.
#
# GitHub repository secrets
# -------------------------
# GCP (pick ONE auth method):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  e.g. projects/123/locations/global/.../providers/github
#   GCP_SERVICE_ACCOUNT             e.g. gh-actions-deploy@PROJECT_ID.iam.gserviceaccount.com
#   OR
#   GCP_SA_KEY                      Service account JSON (single-line or base64 — use WIF if possible)
#
# Build / app:
#   NEXT_PUBLIC_APP_URL             Public site URL, e.g. https://invoice-web-xxxx.a.run.app
#
# Database (Neon):
#   DATABASE_URL                    Used ONLY in this workflow for `prisma migrate deploy`.
#                                   Prefer Neon's *direct* (non-pooled) connection string for migrations;
#                                   pooled URLs often work but Neon recommends direct for schema changes.
#
# Cloud Run runtime: configure DATABASE_URL for the running container (Secret Manager or env var in Console).
#   That value is separate from GitHub — the app needs DB access at runtime; CI needs it to migrate before deploy.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: invoice-agility
  REGION: asia-south1
  AR_REPOSITORY: invoice-repo
  SERVICE: invoice-web
  IMAGE_NAME: invoice-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          has_wif=false
          has_json=false
          if [[ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" && -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]]; then
            has_wif=true
          fi
          if [[ -n "${{ secrets.GCP_SA_KEY }}" ]]; then
            has_json=true
          fi

          if [[ "$has_wif" == true && "$has_json" == true ]]; then
            echo "Provide either WIF secrets (GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT) or GCP_SA_KEY, not both."
            exit 1
          fi
          if [[ "$has_wif" == false && "$has_json" == false ]]; then
            echo "Missing GCP auth secrets. Configure WIF secrets or GCP_SA_KEY."
            echo "Note: secrets are not available to workflows from forks/Dependabot by default."
            exit 1
          fi

          if [[ -z "${{ secrets.DATABASE_URL }}" ]]; then
            echo "Missing DATABASE_URL secret (Neon connection string) — required for prisma migrate deploy."
            exit 1
          fi

          if [[ -z "${{ secrets.NEXT_PUBLIC_APP_URL }}" ]]; then
            echo "Warning: NEXT_PUBLIC_APP_URL is empty; client-side absolute URLs may be wrong. Set the secret to your public Cloud Run URL."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database migrations (Prisma → Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: packages/db
        run: npx prisma migrate deploy

      - id: auth-wif
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: auth-json
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && secrets.GCP_SERVICE_ACCOUNT == '' && secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port 8080
